{% extends "base.html" %}
{% block content %}
  <h2 class="text-2xl font-bold mb-4">List an item</h2>
  <form method="post" enctype="multipart/form-data" class="space-y-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="bg-indigo-600 text-white px-4 py-2 rounded">Save item</button>
  </form>
{% endblock %}
