<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BorrowBuddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <nav class="bg-white shadow px-6 py-3 flex items-center justify-between">
    <a href="{% url 'home' %}" class="text-xl font-bold text-indigo-600">BorrowBuddy</a>
    <div class="flex items-center gap-4">
      <a href="{% url 'item_list' %}" class="hover:underline">Browse items</a>
      {% if user.is_authenticated %}
        <a href="{% url 'my_requests' %}" class="hover:underline">My requests</a>
        <a href="{% url 'earnings' %}" class="hover:underline">Earnings</a>
        <span>Hi, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="text-red-600 hover:underline">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="hover:underline">Login</a>
        <a href="{% url 'signup' %}" class="bg-indigo-600 text-white px-3 py-1 rounded">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main class="max-w-4xl mx-auto mt-10 p-6">
    {% if messages %}
      {% for message in messages %}
        <div class="rounded p-3 mb-4 border
          {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800{% else %}bg-green-50 border-green-200 text-green-800{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
